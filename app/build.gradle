plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dudai.thoughtbank'
    compileSdk 35

    defaultConfig {
        applicationId "com.dudai.thoughtbank"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the Android framework (SQLite, AlarmManager, Notifications).
